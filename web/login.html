<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salon Management - Login</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(to right, #000000, #1c1c1c);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        display: flex;
        width: 800px;
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .left {
        width: 50%;
        background: url('img/carousel-1.jpg') no-repeat center;
        background-size: cover;
    }

    .right {
        width: 50%;
        padding: 40px;
    }

    h2 {
        color: #b08d57;
        margin-bottom: 10px;
    }

    p {
        color: gray;
        font-size: 14px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background: #b08d57;
        border: none;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #8a6d3b;
    }

    .link {
        margin-top: 15px;
        text-align: center;
    }

    .link a {
        color: #b08d57;
        text-decoration: none;
    }
</style>
</head>

<body>

<div class="container">
    
    <div class="left"></div>

    <div class="right">
        <h2>Welcome Back</h2>
        <p>Login to your Salon Account</p>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <div class="link">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    fetch("https://localhost:7020/api/Auth/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: email,
            password: password
        })
    }) 
    .then(response => {
        if (!response.ok) {
            throw new Error("Login failed");
        }
        return response.json();
    })
    .then(data => {
        localStorage.setItem("token", data.token);
        localStorage.setItem("isLoggedIn", "true");

        alert("Login successful!");

        // 🔥 CHECK IF NAAY PENDING BOOKING
        const pendingId = localStorage.getItem("pendingServiceId");

        if(pendingId){
            const name = localStorage.getItem("pendingServiceName");
            const category = localStorage.getItem("pendingCategory");

            const fullService = category.toUpperCase() + " : " + name.toUpperCase();

            localStorage.setItem("serviceId", pendingId);
            localStorage.setItem("serviceName", fullService);

            // CLEAR TEMP DATA
            localStorage.removeItem("pendingServiceId");
            localStorage.removeItem("pendingServiceName");
            localStorage.removeItem("pendingCategory");

            window.location.href = "booking.html";
        }else{
            window.location.href = "index.html";
        }})
        .catch(error => {
            alert("Invalid email or password");
            console.error(error);
        });
    });
</script>

</body>
</html>
